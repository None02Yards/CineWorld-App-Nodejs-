<div class="auth-form">
  <h3>Create your watchlist</h3>

  <form (ngSubmit)="signup()">

    <input
      type="email"
      [(ngModel)]="email"
      name="email"
      placeholder="Email"
      class="form-control mb-3"
      required
    />

    <input
      type="password"
      [(ngModel)]="password"
      name="password"
      placeholder="Password"
      class="form-control mb-3"
      required
    />

    <button class="btn btn-warning w-100">
      Create Account
    </button>

  </form>

  <p class="mt-3">
    Already have an account?
    <a (click)="goToLogin()">Login</a>
  </p>
</div>
